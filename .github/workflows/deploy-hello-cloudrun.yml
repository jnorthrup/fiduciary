name: Deploy hello-world to Cloud Run

on:
  push:
    branches: [ 'merge/main-demo' ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}

      - name: Build and push image
        run: |
          IMAGE=gcr.io/${{ secrets.GCP_PROJECT_ID }}/hello-world:${{ github.sha }}
          gcloud builds submit --tag "$IMAGE" --timeout=20m

      - name: Deploy to Cloud Run
        run: |
          REGION=us-central1
          SERVICE=hello-world
          IMAGE=gcr.io/${{ secrets.GCP_PROJECT_ID }}/hello-world:${{ github.sha }}
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --platform managed --allow-unauthenticated

      - name: Output service URL
        run: |
          gcloud run services describe hello-world --platform managed --region us-central1 --format='value(status.url)'
