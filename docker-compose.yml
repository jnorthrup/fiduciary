# Docker Compose for local development (Thin Demo / Event-Driven)
version: '3.8'

services:
  # Infrastructure
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Databases
  ledger-db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ledger_service
      POSTGRES_USER: ledger_service
      POSTGRES_PASSWORD: ledger_service
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_service -d ledger_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  audit-db:
    image: postgres:15-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: audit_service
      POSTGRES_USER: audit_service
      POSTGRES_PASSWORD: audit_service
    volumes:
      - audit-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_service -d audit_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Services (Monolith as Microservices)
  
  # 1. API Gateway / Frontend Host (if needed, or just routing)
  api-gateway:
    build:
      context: ./server
    ports:
      - "8080:3001" # Expose on 8080 like K8s gateway
    environment:
      NODE_ENV: development
      PORT: 3001
      SERVICE_NAME: api-gateway
      # Routes
      LEDGER_SERVICE_URL: http://ledger-service:3003
      AUDIT_SERVICE_URL: http://audit-service:3006
      # Infra
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 2. Ledger Service (Producer)
  ledger-service:
    build:
      context: ./server
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      SERVICE_NAME: ledger-service
      # DB
      DB_HOST: ledger-db
      DB_PORT: 5432
      DB_NAME: ledger_service
      DB_USER: ledger_service
      DB_PASSWORD: ledger_service
      # Infra
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
    depends_on:
      ledger-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # 3. Audit Service (Consumer)
  audit-service:
    build:
      context: ./server
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: development
      PORT: 3006
      SERVICE_NAME: audit-service
      # DB
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_NAME: audit_service
      DB_USER: audit_service
      DB_PASSWORD: audit_service
      # Infra
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASS: admin
    depends_on:
      audit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  redis-data:
  rabbitmq-data:
  ledger-db-data:
  audit-db-data:

