# Cloud Monitoring Alerts Policy
# Defines alerting policies for deployment health and system failures

apiVersion: monitoring/v3
kind: AlertPolicy
metadata:
  name: ledger-pwa-deployment-failures
  namespace: ledger-pwa

spec:
  displayName: "GKE Deployment Failures"
  documentation:
    content: "Alerts when GKE deployment rollout fails or pods are unhealthy"
  conditions:
    - conditionThreshold:
        aggregations:
          - alignmentPeriod: 300s
            perSeriesAligner: ALIGN_NEXT_OLDER
            crossSeriesReducer: REDUCE_FRACTION_TRUE
            groupByFields:
              - resource.label.project_id
              - resource.label.location
              - resource.label.cluster_name
              - resource.label.namespace_name
        comparison: COMPARISON_GT
        duration: 300s
        filter: |
          resource.type = "k8s_container"
          resource.label.project_id = "${GCP_PROJECT_ID}"
          resource.label.cluster_name = "ledger-pwa-cluster"
          resource.label.namespace_name = "ledger-pwa"
          metric.type = "kubernetes.io/container/restart_count"
        thresholdValue: 0.1
        trigger:
          count: 1
      displayName: "High container restart rate"
  alertStrategy:
    notificationRateLimit:
      period: 3600s
  enabled: true

---
apiVersion: monitoring/v3
kind: AlertPolicy
metadata:
  name: ledger-pwa-health-check-failures
  namespace: ledger-pwa

spec:
  displayName: "Health Check Failures"
  documentation:
    content: "Alerts when HTTP health checks fail consistently"
  conditions:
    - conditionThreshold:
        aggregations:
          - alignmentPeriod: 300s
            perSeriesAligner: ALIGN_FRACTION_TRUE
            crossSeriesReducer: REDUCE_MEAN
        comparison: COMPARISON_LT
        duration: 300s
        filter: |
          resource.type = "http_load_balancer"
          resource.label.project_id = "${GCP_PROJECT_ID}"
          metric.type = "loadbalancing.googleapis.com/https/request_count"
          metric.label.response_code_class = "5xx"
        thresholdValue: 0.95
        trigger:
          count: 3
      displayName: "High 5xx error rate"
  enabled: true

---
apiVersion: monitoring/v3
kind: AlertPolicy
metadata:
  name: ledger-pwa-cold-start-latency
  namespace: ledger-pwa

spec:
  displayName: "Scale-to-Zero Cold Start Latency"
  documentation:
    content: "Alerts when cold-start latency exceeds 30 seconds"
  conditions:
    - conditionThreshold:
        aggregations:
          - alignmentPeriod: 300s
            perSeriesAligner: ALIGN_PERCENTILE_99
            crossSeriesReducer: REDUCE_MEAN
        comparison: COMPARISON_GT
        duration: 600s
        filter: |
          resource.type = "k8s_pod"
          resource.label.project_id = "${GCP_PROJECT_ID}"
          resource.label.cluster_name = "ledger-pwa-cluster"
          resource.label.namespace_name = "ledger-pwa"
          metric.type = "kubernetes.io/pod/start_time"
        thresholdValue: 30.0
        trigger:
          count: 1
      displayName: "Cold start latency > 30s"
  enabled: true

---
apiVersion: monitoring/v3
kind: AlertPolicy
metadata:
  name: ledger-pwa-foundationdb-errors
  namespace: ledger-pwa

spec:
  displayName: "FoundationDB Transaction Errors"
  documentation:
    content: "Alerts when FoundationDB transaction errors increase"
  conditions:
    - conditionThreshold:
        aggregations:
          - alignmentPeriod: 300s
            perSeriesAligner: ALIGN_RATE
            crossSeriesReducer: REDUCE_SUM
        comparison: COMPARISON_GT
        duration: 300s
        filter: |
          resource.type = "foundationdb_instance"
          resource.label.project_id = "${GCP_PROJECT_ID}"
          metric.type = "custom.googleapis.com/foundationdb/transaction_errors"
        thresholdValue: 10
        trigger:
          count: 3
      displayName: "High FDB transaction error rate"
  enabled: true

---
apiVersion: monitoring/v3
kind: AlertPolicy
metadata:
  name: ledger-pwa-build-failures
  namespace: ledger-pwa

spec:
  displayName: "Cloud Build Failures"
  documentation:
    content: "Alerts when Cloud Build steps fail"
  conditions:
    - conditionThreshold:
        aggregations:
          - alignmentPeriod: 300s
            perSeriesAligner: ALIGN_FRACTION_TRUE
            crossSeriesReducer: REDUCE_MEAN
        comparison: COMPARISON_GT
        duration: 60s
        filter: |
          resource.type = "build_project"
          resource.label.project_id = "${GCP_PROJECT_ID}"
          metric.type = "cloudbuild.googleapis.com/builds"
          metric.label.status = "FAILURE"
        thresholdValue: 0
        trigger:
          count: 1
      displayName: "Build failure detected"
  enabled: true

---
# Notification Channels
apiVersion: monitoring/v3
kind: NotificationChannel
metadata:
  name: ledger-pwa-pagerduty
  namespace: ledger-pwa

spec:
  type: pagerduty
  displayName: "PagerDuty - Ledger PWA"
  description: "PagerDuty integration for critical alerts"
  labels:
    - key: PD_SERVICE_KEY
      value: "${PAGERDUTY_SERVICE_KEY}"
  enabled: true

---
apiVersion: monitoring/v3
kind: NotificationChannel
metadata:
  name: ledger-pwa-email
  namespace: ledger-pwa

spec:
  type: email
  displayName: "Email - Ledger PWA Alerts"
  description: "Email notifications for all alerts"
  labels:
    - key: email_address
      value: "${ALERT_EMAIL}"
  enabled: true
