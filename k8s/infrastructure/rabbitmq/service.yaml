apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fiduciary-system
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  ports:
  - name: amqp
    port: 5672
    targetPort: amqp
    protocol: TCP
  - name: management
    port: 15672
    targetPort: management
    protocol: TCP
  selector:
    app: rabbitmq
