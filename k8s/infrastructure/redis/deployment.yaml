apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fiduciary-system
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command:
          - redis-server
          - /etc/redis/redis.conf
        ports:
        - name: redis
          containerPort: 6379
          protocol: TCP
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
              - redis-cli
              - -a
              - $(REDIS_PASSWORD)
              - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - redis-cli
              - -a
              - $(REDIS_PASSWORD)
              - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/redis
      initContainers:
      - name: redis-config
        image: redis:7.2-alpine
        command:
          - sh
          - -c
          - |
            echo "requirepass $REDIS_PASSWORD" > /tmp/redis.conf
            echo "appendonly yes" >> /tmp/redis.conf
            echo "dir /data" >> /tmp/redis.conf
            chmod 600 /tmp/redis.conf
            mv /tmp/redis.conf /etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: config
          mountPath: /etc/redis
      volumes:
      - name: data
        emptyDir: {}
      - name: config
        emptyDir: {}
