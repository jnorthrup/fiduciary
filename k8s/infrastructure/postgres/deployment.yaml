# StatefulSet for PostgreSQL - IRS Service Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: irs-db-postgresql
  namespace: fiduciary-system
  labels:
    app: irs-db
spec:
  serviceName: irs-db-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: irs-db
  template:
    metadata:
      labels:
        app: irs-db
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - name: postgresql
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "irs_service"
        - name: POSTGRES_USER
          value: "irs_service"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: IRS_DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - irs_service
              - -d
              - irs_service
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - irs_service
              - -d
              - irs_service
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
