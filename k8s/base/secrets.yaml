apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: fiduciary-system
type: Opaque
stringData:
  # Database passwords (use external secret management in production)
  # Values should be base64-encoded when applied
  IRS_DB_PASSWORD: "change-me-in-production"
  BSO_DB_PASSWORD: "change-me-in-production"
  LEDGER_DB_PASSWORD: "change-me-in-production"
  BANKING_DB_PASSWORD: "change-me-in-production"
  AUDIT_DB_PASSWORD: "change-me-in-production"
  # Redis
  REDIS_PASSWORD: "change-me-in-production"
  # JWT Secrets
  JWT_SECRET: "change-me-in-production"
  JWT_EXPIRATION: "900"
  # IRS IRIS Credentials (load from external secret store)
  IRS_CLIENT_ID: "your-client-id"
  IRS_CLIENT_SECRET: "your-client-secret"
  IRS_TCC: "your-tcc"
  # Banking Credentials
  TELLER_API_KEY: "your-teller-api-key"
  PLAID_CLIENT_ID: "your-plaid-client-id"
  PLAID_SECRET: "your-plaid-secret"
  # Firebase (use workload identity in production)
  FIREBASE_PROJECT_ID: "your-project-id"
  FIREBASE_CLIENT_EMAIL: "your-service-account"
  FIREBASE_PRIVATE_KEY: "your-private-key"
  # Google GenAI
  GEMINI_API_KEY: "your-gemini-api-key"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: fiduciary-system
type: Opaque
stringData:
  username: "admin"
  password: "change-me-in-production"
