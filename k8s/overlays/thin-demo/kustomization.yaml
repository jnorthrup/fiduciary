apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fiduciary-system

resources:
  # Base configurations
  - ../../base/namespace.yaml
  - ../../base/configmap.yaml
  - ../../base/secrets.yaml
  
  # Network
  - ../../ingress.yaml
  - ../../networkpolicies.yaml
  
  # Infrastructure (Event Driven Core)
  - ../../infrastructure/rabbitmq/deployment.yaml
  - ../../infrastructure/rabbitmq/service.yaml
  - ../../infrastructure/redis/deployment.yaml
  - ../../infrastructure/redis/service.yaml
  
  # Databases
  - ../../infrastructure/postgres/deployment.yaml
  - ../../infrastructure/postgres/service.yaml

  # Services
  - ../../services/api-gateway/deployment.yaml
  - ../../services/api-gateway/service.yaml
  - ../../services/ledger-service/deployment.yaml
  - ../../services/ledger-service/service.yaml
  - ../../services/audit-service/deployment.yaml
  - ../../services/audit-service/service.yaml

  # Observability (Metrics & Logs)
  - ../../observability/prometheus/deployment.yaml
  - ../../observability/prometheus/service.yaml
  - ../../observability/prometheus/configmap.yaml
  - ../../observability/grafana/deployment.yaml
  - ../../observability/grafana/service.yaml
  - ../../observability/grafana/datasources.yaml
  - ../../observability/grafana/dashboards.yaml
  - ../../observability/grafana/secrets.yaml
  - ../../observability/loki/deployment.yaml
  - ../../observability/loki/service.yaml
  - ../../observability/loki/configmap.yaml
  - ../../observability/promtail/daemonset.yaml
  - ../../observability/promtail/configmap.yaml
  - ../../observability/promtail/rbac.yaml

patches:
  # Scale down to 1 replica to be "thin"
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: ledger-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: fiduciary/trust-ledger-server:latest
  - target:
      kind: Deployment
      name: audit-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: fiduciary/trust-ledger-server:latest