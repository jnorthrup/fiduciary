# RabbitMQ ingress policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress-policy
  namespace: fiduciary-system
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values: [irs-service, bso-service, ledger-service, banking-service, audit-service]
    ports:
    - protocol: TCP
      port: 5672
---
# Redis ingress policy
apiVersion: networking.k8s.io/v1
