# GKE Deployment Manifest for Ledger PWA
# Supports GKE Autopilot with scale-to-zero

apiVersion: v1
kind: Namespace
metadata:
  name: ledger-pwa
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ledger-pwa
data:
  VITE_FIREBASE_API_KEY: ""
  VITE_FDB_CLUSTER_FILE: ""
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-pwa
  namespace: ledger-pwa
  labels:
    app: ledger-pwa
    component: pwa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledger-pwa
      component: pwa
  template:
    metadata:
      labels:
        app: ledger-pwa
        component: pwa
    spec:
      serviceAccountName: ledger-pwa
      terminationGracePeriodSeconds: 30
      containers:
      - name: pwa
        image: gcr.io/IMAGE_PLACEHOLDER/ledger-pwa:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: PORT
          value: "80"
        - name: VITE_FIREBASE_API_KEY
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VITE_FIREBASE_API_KEY
        - name: VITE_FDB_CLUSTER_FILE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: VITE_FDB_CLUSTER_FILE
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: / /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-pwa
  namespace: ledger-pwa
  labels:
    app: ledger-pwa
    component: pwa
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    name: http
  selector:
    app: ledger-pwa
    component: pwa
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-pwa-hpa
  namespace: ledger-pwa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-pwa
  minReplicas: 0
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-pwa-pdb
  namespace: ledger-pwa
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: ledger-pwa
      component: pwa
---
# ServiceAccount for workload identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-pwa
  namespace: ledger-pwa
  annotations:
    iam.gke.io/gcp-service-account: $PROJECT_ID.svc.id.goog[ledger-pwa]
---
# NetworkPolicy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-pwa-netpol
  namespace: ledger-pwa
spec:
  podSelector:
    matchLabels:
      app: ledger-pwa
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy: ingress-allowed
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: foundationdb
    - to:
    - namespaceSelector:
        matchLabels:
          k8s-app: cloud-sql
