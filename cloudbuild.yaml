steps:
  # 1. Install & Build Frontend
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci
        export VITE_FIREBASE_ENABLED=true
        export VITE_GMAIL_AUTH_ENABLED=true
        export VITE_IRS_API_URL=/api
        export VITE_DEMO_MODE=false
        export VITE_FIREBASE_API_KEY=AIzaSyD8u9yYG1q0p4Wfa3fONeDhx9u6rKzTsec
        export VITE_FIREBASE_AUTH_DOMAIN=fiduciary-prod.firebaseapp.com
        export VITE_FIREBASE_PROJECT_ID=fiduciary-prod
        export VITE_FIREBASE_STORAGE_BUCKET=fiduciary-prod.firebasestorage.app
        export VITE_FIREBASE_MESSAGING_SENDER_ID=959947902296
        export VITE_FIREBASE_APP_ID=1:959947902296:web:a1b2c3d4e5f6g7h8
        npm run build

  # 2. Prepare Server Directory
  - name: 'alpine'
    script: |
      rm -rf server/public
      mkdir -p server/public
      cp -r dist/* server/public/

  # 3. Build & Publish Container (Cloud Native Buildpacks)
  #    "We are serverless" -> No Dockerfile required.
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - 'gcr.io/fiduciary-prod/trust-ledger-fullstack'
      - '--builder=gcr.io/buildpacks/builder:v1'
      - '--path=./server'
      - '--publish'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trust-ledger-fullstack'
      - '--image'
      - 'gcr.io/fiduciary-prod/trust-ledger-fullstack'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'NODE_ENV=production'

# NOTE: No 'images:' section needed - buildpacks publish directly via --publish flag
