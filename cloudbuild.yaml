steps:
  # 1. Build the container image (Frontend + Backend)
  # Uses root context (.) and specifies Dockerfile path
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'server/Dockerfile', '-t', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:$SHORT_SHA', '-t', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:latest', '.']

  # 2. Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:latest']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trust-ledger-fullstack'
      - '--image'
      - 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'

  # 4. Install & Build Frontend (With User-Defined Env Vars)
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_FIREBASE_ENABLED=true'
      - 'VITE_GMAIL_AUTH_ENABLED=true'
      - 'VITE_IRS_API_URL=/api'

  # 5. Deploy to Firebase Hosting (Primary)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --project $PROJECT_ID --only hosting

  # 6. Deploy to GCS Static Bucket (Secondary/Backup)
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - 'dist/'
      - 'gs://$PROJECT_ID-fullstack-static/'

  # 7. Set Cache Headers for GCS
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
          gs://$PROJECT_ID-fullstack-static/assets/*.js \
          gs://$PROJECT_ID-fullstack-static/assets/*.css \
          gs://$PROJECT_ID-fullstack-static/assets/*.woff* \
          2>/dev/null || true
        gsutil setmeta -h "Cache-Control:public, max-age=3600" \
          gs://$PROJECT_ID-fullstack-static/index.html \
          2>/dev/null || true

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/trust-ledger-fullstack:latest'
