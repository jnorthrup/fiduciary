steps:
  # 1. Install & Build Frontend
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm ci --legacy-peer-deps
        export VITE_FIREBASE_ENABLED=true
        export VITE_GMAIL_AUTH_ENABLED=true
        export VITE_IRS_API_URL=/api
        export VITE_DEMO_MODE=false
        npm run build

  # 2. Prepare Server Directory
  - name: 'alpine'
    script: |
      rm -rf server/public
      mkdir -p server/public
      cp -r dist/* server/public/

  # 3. Build & Publish Container using Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/fiduciary-prod/trust-ledger-fullstack'
      - '-f'
      - './server/Dockerfile'
      - './server'

  # 4. Push Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/fiduciary-prod/trust-ledger-fullstack'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trust-ledger-fullstack'
      - '--image'
      - 'gcr.io/fiduciary-prod/trust-ledger-fullstack'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--set-env-vars'
      - 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=fiduciary-prod'

# NOTE: No 'images:' section needed - buildpacks publish directly via --publish flag
