steps:
  # Build frontend with Firebase config
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install
        VITE_FIREBASE_API_KEY=AIzaSyDuMKgV2vJcZcVM_zZtx0TI3XGsWvC8E6Y \
        VITE_FIREBASE_AUTH_DOMAIN=fiduciary-prod.firebaseapp.com \
        VITE_FIREBASE_PROJECT_ID=fiduciary-prod \
        VITE_FIREBASE_STORAGE_BUCKET=fiduciary-prod.appspot.com \
        VITE_FIREBASE_MESSAGING_SENDER_ID=695109512074 \
        VITE_FIREBASE_APP_ID=1:695109512074:web:3b8c0d9e5b6c6a8d4f5b7 \
        npm run build
  # Build the container image.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'server/Dockerfile', '-t', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack-v2:latest', '.']
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/trust-ledger-fullstack-v2:latest']
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trust-ledger-fullstack-v2'
      - '--image'
      - 'gcr.io/$PROJECT_ID/trust-ledger-fullstack-v2:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1024Mi'
      - '--set-env-vars'
      - 'NODE_ENV=production,RABBITMQ_HOST=""'
timeout: 1200s
images:
  - 'gcr.io/$PROJECT_ID/trust-ledger-fullstack-v2:latest'
