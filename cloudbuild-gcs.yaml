# GCS Static Hosting Deployment for Fullstack Branch
# Replaces Firebase Hosting with Google Cloud Storage + Cloud CDN

steps:
  # 1. Install dependencies
  - name: 'node:20'
    entrypoint: npm
    args: ['ci']

  # 2. Build static frontend (without Gmail/Firebase login)
  - name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    env:
      - 'VITE_FIREBASE_ENABLED=false'
      - 'VITE_GMAIL_AUTH_ENABLED=false'

  # 3. Upload to GCS bucket
  - name: 'gcr.io/cloud-builders/gsutil'
    args:
      - '-m'
      - 'rsync'
      - '-r'
      - '-d'
      - 'dist/'
      - 'gs://$PROJECT_ID-fullstack-static/'

  # 4. Set cache headers for static assets
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gsutil -m setmeta -h "Cache-Control:public, max-age=31536000, immutable" \
          gs://$PROJECT_ID-fullstack-static/assets/*.js \
          gs://$PROJECT_ID-fullstack-static/assets/*.css \
          gs://$PROJECT_ID-fullstack-static/assets/*.woff* \
          2>/dev/null || true
        gsutil setmeta -h "Cache-Control:public, max-age=3600" \
          gs://$PROJECT_ID-fullstack-static/index.html \
          2>/dev/null || true

  # 5. Invalidate Cloud CDN cache (if configured)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud compute url-maps invalidate-cdn-cache $PROJECT_ID-fullstack-lb \
          --path "/*" \
          --async 2>/dev/null || echo "No CDN to invalidate"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
