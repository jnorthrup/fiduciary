openapi: 3.1.0
info:
  title: Trust Ledger System - Unified API
  description: |
    Unified API specification for Trust Ledger System including:
    - IRS IRIS A2A API integration
    - SSA BSO (Business Services Online) integration
    - Ledger/Journal entry management
    - Entity and account management
  version: 1.0.0
  contact:
    name: Trust Ledger API
    email: api@trustledger.systems
  license:
    name: Proprietary

servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://api.trustledger.systems
    description: Production server

tags:
  - name: IRS
    description: IRS IRIS A2A API endpoints
  - name: BSO
    description: SSA Business Services Online endpoints
  - name: Ledger
    description: Journal entry and account management
  - name: Health
    description: System health and status
  - name: Audit
    description: Audit logging and event tracking


paths:
  # ========================================================================
  # Health Endpoints
  # ========================================================================
  /health:
    get:
      tags: [Health]
      summary: System health check
      description: Check if the API server is running
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string

  /api/irs/health:
    get:
      tags: [IRS]
      summary: IRS IRIS service health
      description: Check IRS IRIS A2A API service status
      operationId: irisHealth
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
                  service:
                    type: string
                  version:
                    type: string
                  features:
                    type: array
                    items:
                      type: string
                  endpoints:
                    type: object

  # ========================================================================
  # IRS IRIS A2A Endpoints
  # ========================================================================
  /api/iris/demo/authenticate:
    post:
      tags: [IRS]
      summary: Generate demo JWT tokens
      description: Generate client and user JWTs for testing without real credentials
      operationId: irisDemoAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, userId, tcc, privateKey, keyId]
              properties:
                clientId:
                  type: string
                  description: API Client ID from e-Services
                userId:
                  type: string
                  description: IRIS User ID
                tcc:
                  type: string
                  description: Transmitter Control Code (5 digits)
                  pattern: '^[A-Za-z0-9]{5}$'
                privateKey:
                  type: string
                  format: password
                  description: RSA private key for JWT signing
                keyId:
                  type: string
                  description: Key ID matching JWK upload
      responses:
        '200':
          description: JWTs generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientJWT:
                    type: string
                  userJWT:
                    type: string
                  expiresIn:
                    type: integer
                    description: Token lifetime in seconds
                  message:
                    type: string
        '400':
          description: Missing required credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/iris/auth/oauth/v2/token:
    post:
      tags: [IRS]
      summary: Get OAuth access token
      description: Obtain access token for IRIS A2A API calls using JWT assertions
      operationId: irisOAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, assertion, client_assertion_type, client_assertion]
              properties:
                grant_type:
                  type: string
                  enum: ["urn:ietf:params:oauth:grant-type:jwt-bearer"]
                assertion:
                  type: string
                  description: User JWT (resource owner)
                client_assertion_type:
                  type: string
                  enum: ["urn:ietf:params:oauth:client-assertion-type:jwt-bearer"]
                client_assertion:
                  type: string
                  description: Client JWT (application)
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  refresh_token:
                    type: string
                  expires_in:
                    type: integer

  /api/iris/intake-acceptance:
    post:
      tags: [IRS]
      summary: Submit IRIS transmission
      description: Submit information return transmission for processing
      operationId: irisSubmitTransmission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  description: IRIS XML transmission file
      responses:
        '200':
          description: Transmission accepted
          content:
            text/xml:
              schema:
                type: object
                properties:
                  ReceiptId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/iris/submissions:
    post:
      tags: [IRS]
      summary: Submit information returns (proxy)
      description: Submit 1099 forms through proxy endpoint
      operationId: submitReturns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '202':
          description: Submission received
          content:
            application/json:
              schema:
                type: object
                properties:
                  receiptId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [Received]
                  timestamp:
                    type: string
                    format: date-time
                  estimatedCompletion:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/iris/submissions/{receiptId}/status:
    get:
      tags: [IRS]
      summary: Get submission status
      description: Retrieve processing status of a submission
      operationId: getSubmissionStatus
      parameters:
        - name: receiptId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/iris/tin-validation:
    post:
      tags: [IRS]
      summary: Validate TIN
      description: Interactive TIN matching to verify name/TIN combination
      operationId: validateTIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TINValidationSingle'
                - $ref: '#/components/schemas/TINValidationBatch'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TINValidationResult'
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: '#/components/schemas/TINValidationResult'
                      requestId:
                        type: string
                        format: uuid

  /api/iris/transmission-check:
    post:
      tags: [IRS]
      summary: Pre-transmission validation
      description: Validate submission before transmitting to IRS
      operationId: transmissionCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationError'

  /api/iris/schemas/{formType}:
    get:
      tags: [IRS]
      summary: Get form schema
      description: Retrieve JSON schema for a specific form type
      operationId: getFormSchema
      parameters:
        - name: formType
          in: path
          required: true
          schema:
            type: string
            enum: [1099-NEC, 1099-MISC, 1099-INT, 1099-DIV, 1099-B, 1099-R, 1099-S, W-2, W-2G, 1042-S, 3921, 3922]
      responses:
        '200':
          description: Form schema
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'

  # ========================================================================
  # BSO Endpoints
  # ========================================================================
  /api/bso/register:
    post:
      tags: [BSO]
      summary: Register BSO user
      description: Step 1 of BSO enrollment - register new user
      operationId: bsoRegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password, securityQuestions]
              properties:
                username:
                  type: string
                  minLength: 4
                  maxLength: 20
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                securityQuestions:
                  type: array
                  items:
                    type: object
                    required: [question, answer]
                    properties:
                      question:
                        type: string
                      answer:
                        type: string
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  status:
                    type: string
                    enum: [Pending, Active]
                  activationCode:
                    type: string

  /api/bso/w2/submit:
    post:
      tags: [BSO]
      summary: Submit W-2 EFW2 file
      description: Upload and submit EFW2 format W-2 file
      operationId: bsoSubmitW2
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ein, taxYear, file]
              properties:
                ein:
                  type: string
                  pattern: '^\\d{9}$'
                taxYear:
                  type: string
                  pattern: '^\\d{4}$'
                file:
                  type: string
                filename:
                  type: string
      responses:
        '200':
          description: W-2 submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                  status:
                    type: string
                    enum: [Pending, Processing]

  /api/bso/submissions/{batchId}:
    get:
      tags: [BSO]
      summary: Get W-2 submission status
      description: Retrieve AccuWage validation results
      operationId: bsoGetSubmissionStatus
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Submission status
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchId:
                    type: string
                  status:
                    type: string
                    enum: [Pending, Processing, Pass, Errors, Rejected]
                  accuWageStatus:
                    type: string
                    enum: [Pass, Errors, Pending]
                  submittedAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        message:
                          type: string
                        lineNumber:
                          type: integer

  # ========================================================================
  # Ledger Endpoints
  # ========================================================================
  /api/ledger/entities:
    get:
      tags: [Ledger]
      summary: List all entities
      description: Retrieve all trust/estate entities
      operationId: listEntities
      responses:
        '200':
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'

    post:
      tags: [Ledger]
      summary: Create entity
      description: Create new trust/estate entity
      operationId: createEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityCreate'
      responses:
        '201':
          description: Entity created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'

  /api/ledger/entities/{entityId}:
    get:
      tags: [Ledger]
      summary: Get entity details
      operationId: getEntity
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entity details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'

  /api/ledger/journals:
    get:
      tags: [Ledger]
      summary: List journal entries
      description: Retrieve journal entries with optional filters
      operationId: listJournals
      parameters:
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'

    post:
      tags: [Ledger]
      summary: Create journal entry
      description: Post new journal entry to ledger
      operationId: createJournalEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryCreate'
      responses:
        '201':
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'

  /api/ledger/accounts:
    get:
      tags: [Ledger]
      summary: List chart of accounts
      description: Retrieve all accounts for an entity
      operationId: listAccounts
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
  
  # ========================================================================
  # Audit Endpoints
  # ========================================================================
  /api/audit/events:
    get:
      tags: [Audit]
      summary: List audit events
      description: Retrieve audit events for a trust with filtering
      operationId: listAuditEvents
      security:
        - BearerAuth: []
      parameters:
        - name: trustId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Audit events list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/openapi.yaml:

    get:
      tags: [Health]
      summary: Get OpenAPI specification
      description: Retrieve this OpenAPI specification document
      operationId: getOpenAPISpec
      security: []
      responses:
        '200':
          description: OpenAPI YAML specification
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Error message
        timestamp:
          type: string
          format: date-time
        details:
          type: object

    ValidationError:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: string
        severity:
          type: string
          enum: [ERROR, WARNING]

    SubmissionRequest:
      type: object
      required: [transmitterId, filer, payees]
      properties:
        transmitterId:
          type: string
          description: Transmitter Control Code
          pattern: '^[A-Za-z0-9]{5}$'
        filer:
          type: object
          required: [ein, name]
          properties:
            ein:
              type: string
              pattern: '^\\d{2}-\\d{7}$'
            name:
              type: string
        taxYear:
          type: integer
          minimum: 2020
          maximum: 2030
        payees:
          type: array
          items:
            type: object
            required: [tin, name, amounts]
            properties:
              tin:
                type: string
              name:
                type: string
              amounts:
                type: object

    SubmissionStatus:
      type: object
      required: [receiptId, status]
      properties:
        receiptId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Received, Processing, Accepted, AcceptedWithErrors, Rejected]
        submittedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        recordCount:
          type: integer
        acceptedCount:
          type: integer
        errorCount:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    TINValidationSingle:
      type: object
      required: [tin, name]
      properties:
        tin:
          type: string
          description: Taxpayer Identification Number
          pattern: '^\\d{2}-\\d{7}$|^\\d{3}-\\d{2}-\\d{4}$'
        name:
          type: string
          description: Taxpayer name

    TINValidationBatch:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/TINValidationSingle'

    TINValidationResult:
      type: object
      required: [code, match]
      properties:
        code:
          type: integer
          enum: [0, 1, 2]
          description: 0=Match, 1=No Match, 2=Invalid Format
        match:
          type: boolean
        message:
          type: string
        tin:
          type: string
        name:
          type: string

    Entity:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [Trust, Estate, Individual, Corporation]
        ein:
          type: string
          pattern: '^\\d{2}-\\d{7}$'
        taxYear:
          type: string
          pattern: '^\\d{4}$'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EntityCreate:
      type: object
      required: [name, type, taxYear]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [Trust, Estate, Individual, Corporation]
        ein:
          type: string
          pattern: '^\\d{2}-\\d{7}$'
        taxYear:
          type: string
          pattern: '^\\d{4}$'

    Account:
      type: object
      required: [id, entityId, number, name, type]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        number:
          type: string
          description: Account number (e.g., 1000, 2000)
        name:
          type: string
        type:
          type: string
          enum: [Asset, Liability, Equity, Income, Expense]
        subtype:
          type: string
        balance:
          type: number
          format: double
        isActive:
          type: boolean

    JournalEntry:
      type: object
      required: [id, entityId, date, lines]
      properties:
        id:
          type: string
          format: uuid
        entityId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
        attachments:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    JournalEntryCreate:
      type: object
      required: [entityId, date, lines]
      properties:
        entityId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        description:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
          minItems: 2
        attachments:
          type: array
          items:
            type: string

    JournalLine:
      type: object
      required: [accountId, debit, credit]
      properties:
        accountId:
          type: string
          format: uuid
        description:
          type: string
        debit:
          type: number
          format: double
          minimum: 0
        credit:
          type: number
          format: double
          minimum: 0

    AuditEvent:
      type: object
      required: [eventId, trustId, entityType, entityId, eventType, actorId, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        trustId:
          type: string
          format: uuid
        entityType:
          type: string
        entityId:
          type: string
        eventType:
          type: string
        actorId:
          type: string
        payload:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time

  responses:

    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
