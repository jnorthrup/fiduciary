openapi: 3.1.0
info:
  title: LAS Trust ERP API3
  version: 0.1.0
  description: >
    Ledger-first Trust ERP with settlement orchestration via escrow/sponsored rails.
servers:
  - url: https://api.example.com

x-google-backend:
  address: https://trust-ledger-fullstack-388611398406.us-central1.run.app
  path_translation: APPEND_PATH_TO_ADDRESS

security:
  - bearerAuth: []

tags:
  - name: Trusts
  - name: Trustees
  - name: Ledger
  - name: Assets
  - name: Encumbrances
  - name: Receivables
  - name: Payables
  - name: Settlement
  - name: Documents
  - name: Packets
  - name: Audit

paths:
  /trusts:
    post:
      tags: [Trusts]
      summary: Create a trust profile
      operationId: createTrust
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trust" }
    get:
      tags: [Trusts]
      summary: List trusts (caller scope)
      operationId: listTrusts
      description: |
        Mobile-first paginated list of trusts for the authenticated user.
        Supports cursor-based infinite scroll and sparse fieldsets.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Entity tag for cache validation
              schema: { type: string }
            X-Total-Count:
              description: Total items (optional, may be omitted for performance)
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Trust" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "304":
          description: Not Modified (cache hit via If-None-Match)

  /trusts/{trustId}:
    get:
      tags: [Trusts]
      summary: Get a trust profile
      operationId: getTrust
      parameters:
        - $ref: "#/components/parameters/TrustId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trust" }
    patch:
      tags: [Trusts]
      summary: Update a trust profile
      operationId: updateTrust
      parameters:
        - $ref: "#/components/parameters/TrustId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrustUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trust" }

  /trusts/{trustId}/trustees:
    post:
      tags: [Trustees]
      summary: Add a trustee / authorized signatory
      operationId: addTrustee
      parameters:
        - $ref: "#/components/parameters/TrustId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrusteeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trustee" }
    get:
      tags: [Trustees]
      summary: List trustees for a trust
      operationId: listTrustees
      description: Mobile-first paginated list of trustees/signatories.
      parameters:
        - $ref: "#/components/parameters/TrustId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Trustee" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "304":
          description: Not Modified

  /trustees/{trusteeId}:
    patch:
      tags: [Trustees]
      summary: Update trustee attributes
      operationId: updateTrustee
      parameters:
        - $ref: "#/components/parameters/TrusteeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrusteeUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trustee" }

  /ledger/accounts:
    get:
      tags: [Ledger]
      summary: List chart of accounts for a trust
      operationId: listAccounts
      description: Mobile-first paginated chart of accounts with cursor support.
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "304":
          description: Not Modified
    post:
      tags: [Ledger]
      summary: Create an account
      operationId: createAccount
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }

  /ledger/journal-entries:
    post:
      tags: [Ledger]
      summary: Create a journal entry (draft)
      operationId: createJournalEntry
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JournalEntryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /ledger/journal-entries/{jeId}:
    get:
      tags: [Ledger]
      summary: Get a journal entry
      operationId: getJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalEntryId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /ledger/journal-entries/{jeId}/approve:
    post:
      tags: [Ledger]
      summary: Approve a journal entry (governance)
      operationId: approveJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /ledger/journal-entries/{jeId}/post:
    post:
      tags: [Ledger]
      summary: Post a journal entry (immutable)
      operationId: postJournalEntry
      parameters:
        - $ref: "#/components/parameters/JournalEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostRequest" }
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalEntry" }

  /assets:
    post:
      tags: [Assets]
      summary: Create an asset
      operationId: createAsset
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    get:
      tags: [Assets]
      summary: List assets
      operationId: listAssets
      description: Mobile-first paginated list of trust assets with category filter.
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
        - in: query
          name: category
          schema: { $ref: "#/components/schemas/AssetCategory" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Asset" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "304":
          description: Not Modified

  /assets/{assetId}:
    get:
      tags: [Assets]
      summary: Get an asset
      operationId: getAsset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
    patch:
      tags: [Assets]
      summary: Update an asset
      operationId: updateAsset
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }

  /assets/{assetId}/attachments:
    post:
      tags: [Assets]
      summary: Attach a document/file to an asset (metadata only)
      operationId: addAssetAttachment
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachmentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }

  /assets/{assetId}/encumbrances:
    post:
      tags: [Encumbrances]
      summary: Add an encumbrance to an asset
      operationId: addEncumbrance
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncumbranceCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encumbrance" }

  /encumbrances/{encumbranceId}:
    patch:
      tags: [Encumbrances]
      summary: Update encumbrance status (e.g., released)
      operationId: updateEncumbrance
      parameters:
        - $ref: "#/components/parameters/EncumbranceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EncumbranceUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encumbrance" }

  /receivables:
    post:
      tags: [Receivables]
      summary: Create a receivable (rent, note, invoice)
      operationId: createReceivable
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceivableCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivable" }

  /receivables/{recvId}/schedule/generate:
    post:
      tags: [Receivables]
      summary: Generate a payment schedule for a receivable
      operationId: generateReceivableSchedule
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleGenerateRequest" }
      responses:
        "200":
          description: Generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReceivableSchedule" }

  /receivables/{recvId}/payments:
    post:
      tags: [Receivables]
      summary: Record a payment against a receivable
      operationId: recordReceivablePayment
      parameters:
        - $ref: "#/components/parameters/ReceivableId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceivablePaymentCreate" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceivablePayment" }

  /payables:
    post:
      tags: [Payables]
      summary: Create a payable
      operationId: createPayable
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayableCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }

  /payables/{payableId}/approve:
    post:
      tags: [Payables]
      summary: Approve a payable for execution
      operationId: approvePayable
      parameters:
        - $ref: "#/components/parameters/PayableId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payable" }

  /settlement/payment-orders:
    post:
      tags: [Settlement]
      summary: Create a payment order (internal execution instruction)
      operationId: createPaymentOrder
      parameters:
        - $ref: "#/components/parameters/TrustIdQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentOrderCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /settlement/payment-orders/{paymentOrderId}/approve:
    post:
      tags: [Settlement]
      summary: Approve a payment order
      operationId: approvePaymentOrder
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /settlement/payment-orders/{paymentOrderId}/dispatch:
    post:
      tags: [Settlement]
      summary: Dispatch a payment order (generate packet or call sponsor adapter)
      operationId: dispatchPaymentOrder
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchRequest" }
      responses:
        "200":
          description: Dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /settlement/payment-orders/{paymentOrderId}/mark-executed:
    post:
      tags: [Settlement]
      summary: Mark executed (e.g., escrow confirmed remittance)
      operationId: markPaymentOrderExecuted
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionConfirmRequest" }
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /settlement/payment-orders/{paymentOrderId}/reconcile:
    post:
      tags: [Settlement]
      summary: Reconcile and close (e.g., recorded discharge received)
      operationId: reconcilePaymentOrder
      parameters:
        - $ref: "#/components/parameters/PaymentOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconcileRequest" }
      responses:
        "200":
          description: Reconciled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /documents/templates:
    post:
      tags: [Documents]
      summary: Create a document template (metadata + body stored server-side)
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Template" }

  /documents/generate:
    post:
      tags: [Documents]
      summary: Generate a document from a template
      operationId: generateDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentGenerateRequest" }
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }

  /packets/escrow-payoff:
    post:
      tags: [Packets]
      summary: Generate an escrow payoff packet ZIP (cover letter, resolution, quote, instructions)
      operationId: generateEscrowPayoffPacket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EscrowPayoffPacketRequest" }
      responses:
        "201":
          description: Packet created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Packet" }

  /audit/events:
    get:
      tags: [Audit]
      summary: List audit events
      operationId: listAuditEvents
      description: |
        Mobile-first paginated audit trail with filtering.
        Supports high-volume event streams with cursor pagination.
      parameters:
        - in: query
          name: trustId
          schema: { type: string, format: uuid }
        - in: query
          name: entityType
          description: Filter by entity type (e.g., trust, asset, payment)
          schema: { type: string }
        - in: query
          name: entityId
          description: Filter by specific entity ID
          schema: { type: string }
        - in: query
          name: action
          description: Filter by action type (e.g., create, update, approve)
          schema: { type: string }
        - in: query
          name: since
          description: Filter events after this timestamp (ISO8601)
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "304":
          description: Not Modified

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    # ==========================================================================
    # Mobile-First Pagination Parameters
    # ==========================================================================
    Cursor:
      in: query
      name: cursor
      description: Opaque cursor for infinite scroll pagination (base64 encoded)
      schema: { type: string }
    Limit:
      in: query
      name: limit
      description: Maximum items to return (mobile default 20, max 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      in: query
      name: sort
      description: "Sort order: field:asc or field:desc (e.g., createdAt:desc)"
      schema: { type: string, default: "createdAt:desc" }
    Fields:
      in: query
      name: fields
      description: Comma-separated field names for sparse fieldsets (mobile optimization)
      schema: { type: string, example: "id,name,amount,status" }
    IfNoneMatch:
      in: header
      name: If-None-Match
      description: ETag from previous response for cache validation
      schema: { type: string }

    # ==========================================================================
    # Entity ID Parameters
    # ==========================================================================
    TrustId:
      in: path
      name: trustId
      required: true
      schema: { type: string, format: uuid }
    TrustIdQuery:
      in: query
      name: trustId
      required: true
      schema: { type: string, format: uuid }
    TrusteeId:
      in: path
      name: trusteeId
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      in: path
      name: assetId
      required: true
      schema: { type: string, format: uuid }
    EncumbranceId:
      in: path
      name: encumbranceId
      required: true
      schema: { type: string, format: uuid }
    ReceivableId:
      in: path
      name: recvId
      required: true
      schema: { type: string, format: uuid }
    PayableId:
      in: path
      name: payableId
      required: true
      schema: { type: string, format: uuid }
    PaymentOrderId:
      in: path
      name: paymentOrderId
      required: true
      schema: { type: string, format: uuid }
    JournalEntryId:
      in: path
      name: jeId
      required: true
      schema: { type: string, format: uuid }

  schemas:
    # ==========================================================================
    # Mobile-First Pagination Response
    # ==========================================================================
    PaginationMeta:
      type: object
      description: Cursor-based pagination metadata for mobile infinite scroll
      required: [hasMore]
      properties:
        cursor:
          type: string
          nullable: true
          description: Cursor for next page (null if no more data)
        hasMore:
          type: boolean
          description: Whether more items exist beyond this page
        total:
          type: integer
          nullable: true
          description: Total count (optional, expensive for large datasets)
        limit:
          type: integer
          description: Items per page
        sort:
          type: string
          description: Applied sort order

    # ==========================================================================
    # Entity Schemas
    # ==========================================================================
    TrustCreate:
      type: object
      required: [legalNameFull, dateOfTrust, ein, situsState]
      properties:
        legalNameFull: { type: string }
        dateOfTrust: { type: string, format: date }
        ein: { type: string, description: "Stored encrypted at rest." }
        situsState: { type: string, minLength: 2, maxLength: 2 }
        mailingAddress: { $ref: "#/components/schemas/PostalAddress" }
    TrustUpdate:
      type: object
      properties:
        mailingAddress: { $ref: "#/components/schemas/PostalAddress" }
        status: { type: string, enum: [active, inactive] }
    Trust:
      allOf:
        - $ref: "#/components/schemas/TrustCreate"
        - type: object
          required: [trustId, status, createdAt]
          properties:
            trustId: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive] }
            createdAt: { type: string, format: date-time }

    TrusteeCreate:
      type: object
      required: [fullName, role]
      properties:
        fullName: { type: string }
        role: { type: string, enum: [co_trustee, authorized_signatory] }
        independentSigningAuthority: { type: boolean, default: false }
        authorityBasisDocId: { type: string, format: uuid, nullable: true }
    TrusteeUpdate:
      type: object
      properties:
        role: { type: string, enum: [co_trustee, authorized_signatory] }
        independentSigningAuthority: { type: boolean }
        authorityBasisDocId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }
    Trustee:
      allOf:
        - $ref: "#/components/schemas/TrusteeCreate"
        - type: object
          required: [trusteeId, trustId, status, createdAt]
          properties:
            trusteeId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            status: { type: string, enum: [active, inactive] }
            createdAt: { type: string, format: date-time }

    AccountType:
      type: string
      enum: [asset, liability, equity, income, expense]
    Account:
      type: object
      required: [accountId, trustId, code, name, type, createdAt]
      properties:
        accountId: { type: string, format: uuid }
        trustId: { type: string, format: uuid }
        code: { type: string, description: "e.g., 1010" }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        parentAccountId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string }
        name: { type: string }
        type: { $ref: "#/components/schemas/AccountType" }
        parentAccountId: { type: string, format: uuid, nullable: true }

    JournalEntryStatus:
      type: string
      enum: [draft, approved, posted, voided]
    JournalEntryCreate:
      type: object
      required: [date, memo, lines]
      properties:
        date: { type: string, format: date }
        memo: { type: string }
        sourceModule: { type: string, default: "manual" }
        lines:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/JournalLineCreate" }
    JournalLineCreate:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
        debit: { type: number, nullable: true }
        credit: { type: number, nullable: true }
        entityRefType: { type: string, nullable: true }
        entityRefId: { type: string, nullable: true }
        memo: { type: string, nullable: true }
    JournalEntry:
      allOf:
        - $ref: "#/components/schemas/JournalEntryCreate"
        - type: object
          required: [jeId, trustId, status, createdAt]
          properties:
            jeId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/JournalEntryStatus" }
            approvedAt: { type: string, format: date-time, nullable: true }
            postedAt: { type: string, format: date-time, nullable: true }
            createdAt: { type: string, format: date-time }

    AssetCategory:
      type: string
      enum: [RealProperty, PreciousMetals, NoteReceivable, Vehicle, Jewelry, Other]
    AssetStatus:
      type: string
      enum: [active, disposed]
    AssetCreate:
      type: object
      required: [category, name, acquiredDate]
      properties:
        category: { $ref: "#/components/schemas/AssetCategory" }
        name: { type: string }
        description: { type: string, nullable: true }
        acquiredDate: { type: string, format: date }
        basisAmount: { type: number, nullable: true }
        fairValueAmount: { type: number, nullable: true }
        valuationMethod: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AssetStatus", default: "active" }
        realProperty:
          $ref: "#/components/schemas/RealPropertyDetails"
          nullable: true
    AssetUpdate:
      type: object
      properties:
        description: { type: string, nullable: true }
        basisAmount: { type: number, nullable: true }
        fairValueAmount: { type: number, nullable: true }
        valuationMethod: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/AssetStatus" }
    Asset:
      allOf:
        - $ref: "#/components/schemas/AssetCreate"
        - type: object
          required: [assetId, trustId, createdAt]
          properties:
            assetId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    RealPropertyDetails:
      type: object
      properties:
        address: { $ref: "#/components/schemas/PostalAddress" }
        county: { type: string, nullable: true }
        parcelId: { type: string, nullable: true }
        legalDescription: { type: string, nullable: true }
        occupancyStatus: { type: string, enum: [vacant, tenant], default: vacant }
        insurancePolicyId: { type: string, nullable: true }

    EncumbranceType:
      type: string
      enum: [external_mortgage, internal_security]
    EncumbranceStatus:
      type: string
      enum: [active, released]
    EncumbranceCreate:
      type: object
      required: [type, holderName, status]
      properties:
        type: { $ref: "#/components/schemas/EncumbranceType" }
        holderName: { type: string }
        referenceDocId: { type: string, format: uuid, nullable: true }
        originalAmount: { type: number, nullable: true }
        currentEstimatedBalance: { type: number, nullable: true }
        status: { $ref: "#/components/schemas/EncumbranceStatus" }
    EncumbranceUpdate:
      type: object
      properties:
        currentEstimatedBalance: { type: number, nullable: true }
        status: { $ref: "#/components/schemas/EncumbranceStatus" }
        referenceDocId: { type: string, format: uuid, nullable: true }
    Encumbrance:
      allOf:
        - $ref: "#/components/schemas/EncumbranceCreate"
        - type: object
          required: [encumbranceId, assetId, createdAt]
          properties:
            encumbranceId: { type: string, format: uuid }
            assetId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    ReceivableType:
      type: string
      enum: [Rent, Note, Invoice, Reimbursement]
    PaymentFrequency:
      type: string
      enum: [monthly, quarterly, annually]
    ReceivableCreate:
      type: object
      required: [type, counterpartyType, counterpartyId, principalAmount]
      properties:
        type: { $ref: "#/components/schemas/ReceivableType" }
        counterpartyType: { type: string, enum: [tenant, borrower, vendor, other] }
        counterpartyId: { type: string }
        principalAmount: { type: number }
        interestRate: { type: number, nullable: true }
        termMonths: { type: integer, nullable: true }
        paymentFrequency: { $ref: "#/components/schemas/PaymentFrequency", default: monthly }
        status: { type: string, enum: [active, closed], default: active }
    Receivable:
      allOf:
        - $ref: "#/components/schemas/ReceivableCreate"
        - type: object
          required: [recvId, trustId, createdAt]
          properties:
            recvId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    ScheduleGenerateRequest:
      type: object
      required: [startDate]
      properties:
        startDate: { type: string, format: date }
        count: { type: integer, minimum: 1, maximum: 600, default: 12 }
    ReceivableSchedule:
      type: object
      required: [schedId, recvId, dueDate, amountDue, status]
      properties:
        schedId: { type: string, format: uuid }
        recvId: { type: string, format: uuid }
        dueDate: { type: string, format: date }
        amountDue: { type: number }
        principalComponent: { type: number, nullable: true }
        interestComponent: { type: number, nullable: true }
        status: { type: string, enum: [due, paid, late], default: due }

    ReceivablePaymentCreate:
      type: object
      required: [amount, paidAt]
      properties:
        amount: { type: number }
        paidAt: { type: string, format: date-time }
        method: { type: string, nullable: true }
        reference: { type: string, nullable: true }
    ReceivablePayment:
      allOf:
        - $ref: "#/components/schemas/ReceivablePaymentCreate"
        - type: object
          required: [paymentId, recvId]
          properties:
            paymentId: { type: string, format: uuid }
            recvId: { type: string, format: uuid }

    PayableType:
      type: string
      enum: [Vendor, MortgagePayoff, Tax, Insurance, Utilities, Repair]
    PayableCreate:
      type: object
      required: [type, payeeId, amount, dueDate]
      properties:
        type: { $ref: "#/components/schemas/PayableType" }
        payeeId: { type: string }
        amount: { type: number }
        dueDate: { type: string, format: date }
        status: { type: string, enum: [draft, approved, scheduled, executed, reconciled, cancelled], default: draft }
    Payable:
      allOf:
        - $ref: "#/components/schemas/PayableCreate"
        - type: object
          required: [payableId, trustId, createdAt]
          properties:
            payableId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    PaymentMethod:
      type: string
      enum: [ESCROW_PAYOFF, SPONSORED_ACH, SPONSORED_WIRE, CHECK_VENDOR, MANUAL_CERTIFIED_FUNDS]
    FundingSourceType:
      type: string
      enum: [asset_liquidation, receivable_collection, clearing_agent, other]
    PaymentOrderCreate:
      type: object
      required: [payableId, amount, method, fundingSourceType]
      properties:
        payableId: { type: string, format: uuid }
        amount: { type: number }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        fundingSourceType: { $ref: "#/components/schemas/FundingSourceType" }
        supportingDocIds:
          type: array
          items: { type: string, format: uuid }
    PaymentOrder:
      allOf:
        - $ref: "#/components/schemas/PaymentOrderCreate"
        - type: object
          required: [paymentOrderId, trustId, status, createdAt]
          properties:
            paymentOrderId: { type: string, format: uuid }
            trustId: { type: string, format: uuid }
            status: { type: string, enum: [initiated, approved, sent, executed, reconciled, failed], default: initiated }
            createdAt: { type: string, format: date-time }

    DispatchRequest:
      type: object
      properties:
        adapterConfig:
          type: object
          additionalProperties: true
        notes: { type: string, nullable: true }
    ExecutionConfirmRequest:
      type: object
      required: [executedAt]
      properties:
        executedAt: { type: string, format: date-time }
        confirmationRef: { type: string, nullable: true }
        attachmentDocIds:
          type: array
          items: { type: string, format: uuid }
    ReconcileRequest:
      type: object
      required: [reconciledAt]
      properties:
        reconciledAt: { type: string, format: date-time }
        dischargeRecordedInstrumentNo: { type: string, nullable: true }
        attachmentDocIds:
          type: array
          items: { type: string, format: uuid }

    ApprovalRequest:
      type: object
      required: [reason, mfaVerified]
      properties:
        reason: { type: string }
        mfaVerified: { type: boolean }
        ip: { type: string, nullable: true }
        device: { type: string, nullable: true }
    PostRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    TemplateCreate:
      type: object
      required: [name, type, body]
      properties:
        name: { type: string }
        type: { type: string, enum: [html, docx, markdown] }
        body: { type: string, description: "Template body stored server-side." }
    Template:
      allOf:
        - $ref: "#/components/schemas/TemplateCreate"
        - type: object
          required: [templateId, createdAt]
          properties:
            templateId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    DocumentGenerateRequest:
      type: object
      required: [templateId, payload]
      properties:
        templateId: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true
        trustId: { type: string, format: uuid, nullable: true }
    Document:
      type: object
      required: [docId, templateId, uri, sha256, createdAt]
      properties:
        docId: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        uri: { type: string }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }

    AttachmentCreate:
      type: object
      required: [uri, sha256, mimeType]
      properties:
        uri: { type: string }
        sha256: { type: string }
        mimeType: { type: string }
        label: { type: string, nullable: true }
    Attachment:
      allOf:
        - $ref: "#/components/schemas/AttachmentCreate"
        - type: object
          required: [attachmentId, createdAt]
          properties:
            attachmentId: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }

    EscrowPayoffPacketRequest:
      type: object
      required: [trustId, payableId, paymentOrderId]
      properties:
        trustId: { type: string, format: uuid }
        payableId: { type: string, format: uuid }
        paymentOrderId: { type: string, format: uuid }
        includeDocs:
          type: array
          items: { type: string, format: uuid }
    Packet:
      type: object
      required: [packetId, type, uri, sha256, createdAt]
      properties:
        packetId: { type: string, format: uuid }
        type: { type: string, enum: [ESCROW_PAYOFF] }
        uri: { type: string }
        sha256: { type: string }
        createdAt: { type: string, format: date-time }

    AuditEvent:
      type: object
      required: [eventId, trustId, entityType, entityId, eventType, actorId, occurredAt]
      properties:
        eventId: { type: string, format: uuid }
        trustId: { type: string, format: uuid }
        entityType: { type: string }
        entityId: { type: string }
        eventType: { type: string }
        actorId: { type: string }
        payload:
          type: object
          additionalProperties: true
        occurredAt: { type: string, format: date-time }

    PostalAddress:
      type: object
      properties:
        line1: { type: string, nullable: true }
        line2: { type: string, nullable: true }
        city: { type: string, nullable: true }
        state: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        country: { type: string, default: "US" }
