{{- range $service, $config := .Values.services }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service | replace "Service" "" | lower }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "trust-ledger-system.labels" $ | nindent 4 }}
    app: {{ $service | replace "Service" "" | lower }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      app: {{ $service | replace "Service" "" | lower }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ $service | replace "Service" "" | lower }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $config.port }}"
        prometheus.io/path: "/metrics"
    spec:
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ $service | replace "Service" "" | lower }}
        image: "{{ $.Values.images[$service].repository }}:{{ $.Values.images[$service].tag }}"
        imagePullPolicy: {{ $.Values.images[$service].pullPolicy }}
        ports:
        - name: http
          containerPort: {{ $config.port }}
          protocol: TCP
        env:
        - name: PORT
          value: "{{ $config.port }}"
        - name: SERVICE_NAME
          value: "{{ $service | replace "Service" "" | lower }}"
        - name: NODE_ENV
          value: {{ $.Values.config.nodeEnv | quote }}
        - name: LOG_LEVEL
          value: {{ $.Values.config.logLevel | quote }}
        {{- if $config.resources }}
        resources:
          {{- toYaml $config.resources | nindent 10 }}
        {{- end }}
        {{- with $.Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
{{- end }}
{{- end }}
