apiVersion: v2
name: trust-ledger-system
description: A Helm chart for Trust Ledger System microservices
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - fiduciary
  - ledger
  - microservices
maintainers:
  - name: Trust Ledger Team
    email: team@fiduciary.example.com
dependencies:
  - name: redis
    version: "^17.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq
    version: "^11.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    alias: irs-db
    condition: irs-db.enabled
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    alias: bso-db
    condition: bso-db.enabled
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    alias: ledger-db
    condition: ledger-db.enabled
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    alias: banking-db
    condition: banking-db.enabled
  - name: postgresql
    version: "^12.0.0"
    repository: "https://charts.bitnami.com/bitnami"
    alias: audit-db
    condition: audit-db.enabled
